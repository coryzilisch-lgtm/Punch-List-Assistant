<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Punch List Assistant — Buffalo Construction</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet" />
<!--
  The launcher Procore embeds.

  Procore renders an installed app inside an iframe, and this app is gated by
  Microsoft Entra — whose sign-in page, like Procore's own, refuses to render in
  a frame. So the app itself cannot simply be the embedded URL: an unauthenticated
  frame navigates to the Microsoft login and the panel dies as a browser error
  page, which is exactly what happened.

  Rather than weaken the Entra gate to make a frame work, the frame holds a page
  with nothing in it worth gating — no data, no API calls, no identity — whose
  only job is to open the real app in a top-level tab where sign-in behaves
  normally. That keeps one front door and one identity provider.

  Styles are inline because this page is served on its own, without the app's
  stylesheet, and it must render correctly the first time inside someone else's
  frame on jobsite LTE.
-->
<style>
  :root { --navy:#00253D; --orange:#FF5F00; --cream:#F3F7F5; --ink:#171C26; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--cream); color: var(--ink);
    font-family: Montserrat, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 32px 20px;
  }
  .card {
    background: #fff; border-radius: 14px; padding: 40px; max-width: 520px; width: 100%;
    box-shadow: 0 2px 20px rgba(0,37,61,.10); text-align: center;
  }
  .mark { width: 56px; height: 56px; margin-bottom: 18px; }
  h1 { font-size: 22px; font-weight: 800; color: var(--navy); margin: 0 0 10px; letter-spacing: -.01em; }
  p { font-size: 14px; line-height: 1.6; color: #4A5568; margin: 0 0 26px; }
  .btn {
    display: inline-block; background: var(--orange); color: #fff; text-decoration: none;
    font-weight: 700; font-size: 15px; padding: 14px 28px; border-radius: 8px;
  }
  .btn:hover { filter: brightness(.94); }
  .foot { margin: 22px 0 0; font-size: 12px; color: #718096; }
</style>
</head>
<body>
  <div class="card">
    <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
      <path fill="#FF5F00" d="M6 18c0-4 3-7 7-7h4l3-4h8l3 4h4c4 0 7 3 7 7v3l-3 2v6l3 3-2 4-5-3-2 5h-6l-1-4h-6l-1 4h-6l-2-5-5 3-2-4 3-3v-6l-3-2z"/>
    </svg>
    <h1>Punch List Assistant</h1>
    <p>
      Turn an owner's punch list PDF into Procore punch items — read, reviewed and
      pushed in one pass.
    </p>
    <a class="btn" id="open" href="/" target="_blank" rel="noopener">Open Punch List Assistant</a>
    <p class="foot">Opens in a new tab so you can sign in with your Buffalo account.</p>
  </div>

<script>
  // Carry the project across when Procore tells us which one we are in.
  //
  // Procore passes project and company ids on the embedded URL, but the exact
  // parameter names are not something to assume — this integration has already
  // paid three times for guessing at Procore's contracts. So: forward whichever
  // of the plausible names is actually present, and forward nothing when none
  // is. A missing id costs one dropdown; a wrong one would send a super to the
  // wrong job's punch list.
  (function () {
    var here = new URLSearchParams(location.search);
    var projectId =
      here.get('procore_project_id') || here.get('project_id') || here.get('projectId');
    if (!projectId || !/^\d+$/.test(projectId)) return;

    var link = document.getElementById('open');
    link.href = '/?project_id=' + encodeURIComponent(projectId);
  })();
</script>
</body>
</html>
