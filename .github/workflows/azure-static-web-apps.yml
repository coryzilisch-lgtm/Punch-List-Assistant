name: Azure Static Web Apps CI/CD

# Authenticates with the DEPLOYMENT TOKEN only — deliberately not OIDC.
#
# Azure's generated workflow adds an OIDC path (an id-token permission, two
# setup steps, and a `github_id_token` input). That path identifies the Static
# Web App by matching the WORKFLOW FILENAME against the name Azure generated
# (`azure-static-web-apps-<adjective>-<noun>-<hex>.yml`), so renaming the file —
# or recreating the app, which changes the expected name — fails with:
#
#   Could not determine the Static Web App from the GitHub OIDC workflow
#   reference. Ensure the workflow file generated by Azure Static Web Apps has
#   not been renamed.
#
# Token auth has no such coupling. With OIDC removed, the filename is ours, and
# recreating the Static Web App means updating one secret value with nothing in
# the repo to change. Get the token from the app's Overview → Manage deployment
# token, and store it as AZURE_STATIC_WEB_APPS_API_TOKEN.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          # app_location is the static site; api_location MUST point at the
          # Functions folder or the whole /api/* surface 404s and the app loads
          # as a shell. Azure's generated default was an empty api_location.
          app_location: "./dashboard"
          api_location: "api"
          output_location: ""

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          # Azure's generated workflow omits the token here, and the close job
          # then fails on every PR close. Same fix the Safety Dashboard needed.
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
